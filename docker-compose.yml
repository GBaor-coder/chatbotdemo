services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chatbot
      PGVECTOR_DIM: "1024"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chatbot"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build: ./ai-service
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chatbot
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      PGVECTOR_DIM: "1024"
      EMBEDDING_MODEL: BAAI/bge-m3
      EMBEDDING_DEVICE: cpu
      LLM_BASE_URL: http://host.docker.internal:20128/v1
      LLM_API_KEY: sk-57a432014c1cc01c-6juq1i-fe7dbfbd
      LLM_MODEL: chatbotai
      GATEWAY_URL: http://backend-dotnet:5000
      LOG_LEVEL: INFO
      TRANSFORMERS_CACHE: /root/.cache/huggingface/hub
      HF_HOME: /root/.cache/huggingface
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - hf-cache:/root/.cache/huggingface
    user: root
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 5

  backend-dotnet:
    build: ./backend-dotnet
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=chatbot;Username=postgres;Password=postgres
      AI_SERVICE_URL: http://ai-service:8000
      ASPNETCORE_URLS: http://+:5000
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  frontend-react:
    build: ./frontend-react
    ports:
      - "5173:80"
    depends_on:
      backend-dotnet:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  hf-cache:
